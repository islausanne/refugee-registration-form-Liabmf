<!-- This is my menu page, it then gets extended to my other pages, this is where the user will first be taken when they frist click to link to the website -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Menu</title>

    <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- This is all CSS code, just to split the screen in half, so that on half is light blue and the ohter is white -->
    <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: linear-gradient(to left,#e9f2ff 50%, white 50%);
      font-family: Arial, sans-serif;
    }

    .content {
      width: 100%;
      max-width: 1200px; /* Optional: limit width for readability */
      margin: 0 auto;
      padding: 50px;
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
    }
  </style>
</head>
<body>
 <div class="half left"></div>
  <div class="half right"></div>
 <!-- This is so that the logo will be in the top corner of my menu page/ all my pages on the left side -->
<img src="/static/Logo.png" width="300px" height="93px"</img>


<div class="right-menu">
<!-- this is for the code on the right side, this code, makes links to all the other pages, pne to the view page, one to the register page, and one back to the menu page
 this is how the user can switch through different pages quickly-->
    <nav>
        <a href="/">Home</a>
        <a href="/view">View</a>
        <a href="/register">Register</a>
    </nav>
</div>

<div class="page-content">
    {% block content %}
    {% endblock %}
</div>


</body>
</html>
</html>
