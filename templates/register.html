<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>

<form method="POST" action="{{ url_for('submit_form') }}">
  <p><input type="text" name="name" placeholder="First name" required>
  <input type="text" name="lname" placeholder="Last name" required></p>
  <p><input type="text" name="country" placeholder="Country of origin" required></p>
  <p><input type="number" name="age" placeholder="Age" required></p>
  <p><input type="text" name="medical" placeholder="Medical issues" required></p>
  <p><button type="submit">Submit </button></p>
</form>
</body>
</html>
