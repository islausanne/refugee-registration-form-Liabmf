<head>

    <title>Register</title>

<body>
<p><img src="/static/basic.png" width="50px" height="65px"</img> <h2>Personal information</h2></p>

<form method="POST" action="{{ url_for('submit_form') }}">

    <p><input type="number" name="age" placeholder="Age" required>

    <p><input type="date" name="dob" placeholder="Date of birth" required>

<p><img src="/static/globe.png" width="50px" height="50px"</img> <h2>Personal information 2</h2></p>
